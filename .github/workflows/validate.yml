name: Validate SEO Kit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installation:
    name: Global installation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Enable long Git paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: Test global installation and updates in temporary profiles
        run: node --test .agents/tests/installation.test.mjs

  validate:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Avoid selecting an unrelated user-managed audit runtime.
      SEO_KIT_PYTHON: python3
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .agents/requirements-audit.lock

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install pinned Python dependencies
        run: python3 -m pip install --require-hashes -r .agents/requirements-audit.lock

      - name: Validate repository and run tests
        run: npm run validate

      - name: Check generated adapters are committed
        run: |
          git diff --exit-code -- .agents/adapters/
          if [ -n "$(git ls-files --others --exclude-standard -- .agents/adapters/)" ]; then
            echo "::error::Generated adapters are missing from Git. Run npm run build and commit the results."
            exit 1
          fi
